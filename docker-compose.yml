services:
  db:
    image: postgres:16-alpine
    container_name: gantt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: gantt
      POSTGRES_DB: gantt_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantt -d gantt_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gantt-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gantt:gantt@db:5432/gantt_2026
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  pgdata:
