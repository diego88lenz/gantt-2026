<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento 2026</title>
    <meta name="description" content="Gráfico de Gantt interativo para planejamento e gestão de projetos em 2026">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Planejamento Inteligência de Dados <span id="yearDisplay">2026</span></h1>
            <p class="subtitle">Planejamento e Gestão</p>
            <div class="header-right">
                <select id="yearSelect" class="year-select">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
                <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                    <i data-lucide="sun"></i>
                </button>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn btn-primary" id="addTaskBtn">
                    <i data-lucide="plus"></i> Nova Tarefa
                </button>
                <button class="btn btn-ghost" id="addCategoryBtn">
                    <i data-lucide="tags"></i> Categorias
                </button>
            </div>

            <div class="toolbar-search">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Buscar tarefas...">
            </div>

            <div class="toolbar-group toolbar-view">
                <div class="segmented" role="group" aria-label="Modo de visualização">
                    <button class="seg-btn active" id="viewTableBtn" title="Visão de tabela">
                        <i data-lucide="table-2"></i>
                    </button>
                    <button class="seg-btn" id="viewBarBtn" title="Visão de gráfico">
                        <i data-lucide="bar-chart-3"></i>
                    </button>
                </div>
                <select id="zoomSelect" class="select-control" title="Nível de zoom">
                    <option value="12">Anual</option>
                    <option value="4">Trimestral</option>
                    <option value="2">Semestral</option>
                </select>
                <select id="assigneeFilter" class="select-control" title="Filtrar por responsável">
                    <option value="">Responsáveis</option>
                </select>
            </div>

            <div class="toolbar-group toolbar-actions">
                <button class="icon-btn" id="undoBtn" title="Desfazer (Ctrl+Z)">
                    <i data-lucide="undo-2"></i>
                </button>
                <button class="icon-btn" id="redoBtn" title="Refazer (Ctrl+Y)">
                    <i data-lucide="redo-2"></i>
                </button>
                <button class="icon-btn" id="statsBtn" title="Dashboard (Ctrl+D)">
                    <i data-lucide="layout-dashboard"></i>
                </button>
                <div class="dropdown">
                    <button class="icon-btn" id="dataMenuBtn" title="Dados e compartilhamento" aria-haspopup="true"
                        aria-expanded="false">
                        <i data-lucide="more-horizontal"></i>
                    </button>
                    <div class="dropdown-menu" id="dataMenu">
                        <button class="dropdown-item" id="exportBtn"><i data-lucide="download"></i> Exportar JSON</button>
                        <button class="dropdown-item" id="exportPngBtn"><i data-lucide="image"></i> Exportar PNG</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="importBtn"><i data-lucide="upload"></i> Importar JSON</button>
                        <button class="dropdown-item" id="importCsvBtn"><i data-lucide="file-spreadsheet"></i> Importar
                            CSV</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="shareBtn"><i data-lucide="share-2"></i> Copiar link</button>
                    </div>
                </div>
            </div>

            <input type="file" id="importCsvFile" accept=".csv" style="display: none;">
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>

        <div class="gantt-wrapper" id="ganttWrapper">
            <div class="gantt-container" id="ganttContainer">
                <table class="gantt-table" id="ganttTable">
                    <thead>
                        <tr>
                            <th>PROJETOS</th>
                            <th>JAN</th>
                            <th>FEV</th>
                            <th>MAR</th>
                            <th>ABR</th>
                            <th>MAI</th>
                            <th>JUN</th>
                            <th>JUL</th>
                            <th>AGO</th>
                            <th>SET</th>
                            <th>OUT</th>
                            <th>NOV</th>
                            <th>DEZ</th>
                        </tr>
                    </thead>
                    <tbody id="ganttBody">
                        <!-- Content will be generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bar Chart View -->
        <div class="gantt-wrapper" id="barChartView" style="display: none;">
            <div class="bar-chart-container" id="barChartContainer">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard" style="display: none;">
            <div class="dash-card">
                <span class="dash-value" id="dashTotalTasks">0</span>
                <span class="dash-label">Total de Tarefas</span>
            </div>
            <div class="dash-card">
                <span class="dash-value" id="dashCompleted">0</span>
                <span class="dash-label">Concluídas (100%)</span>
            </div>
            <div class="dash-card">
                <span class="dash-value" id="dashInProgress">0</span>
                <span class="dash-label">Em Andamento</span>
            </div>
            <div class="dash-card">
                <span class="dash-value" id="dashNotStarted">0</span>
                <span class="dash-label">Não Iniciadas</span>
            </div>
            <div class="dash-card">
                <span class="dash-value" id="dashBusiestMonth">-</span>
                <span class="dash-label">Mês Mais Carregado</span>
            </div>
            <div class="dash-card">
                <span class="dash-value" id="dashAvgProgress">0%</span>
                <span class="dash-label">Progresso Médio</span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color projects"></div>
                <span>Geral</span>
            </div>
            <div class="legend-item">
                <div class="legend-color data"></div>
                <span>Dados</span>
            </div>
        </div>
    </div>

    <!-- Modal for Adding/Editing Tasks -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h2 id="modalTitle">Adicionar Nova Tarefa</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Nome da Tarefa:</label>
                    <input type="text" id="taskName" required>
                </div>

                <div class="form-group">
                    <label for="taskCategory">Categoria:</label>
                    <select id="taskCategory" required>
                        <option value="projects">Geral</option>
                        <option value="data">Dados</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskAssignee">Responsável:</label>
                    <input type="text" id="taskAssignee" placeholder="Nome do responsável">
                </div>

                <div class="form-group">
                    <label for="taskProgress">Progresso (%):</label>
                    <div class="progress-input-group">
                        <input type="range" id="taskProgress" min="0" max="100" value="0" step="5">
                        <span class="progress-value" id="progressValue">0%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="taskMilestone">
                        <span>Marcos / Milestone</span>
                    </label>
                </div>

                <div class="form-group" id="dependencyGroup">
                    <label for="taskDependency">Dependência (tarefa anterior):</label>
                    <select id="taskDependency">
                        <option value="">Nenhuma</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Meses:</label>
                    <div class="month-checkboxes">
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-0" value="0">
                            <label for="month-0">JAN</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-1" value="1">
                            <label for="month-1">FEV</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-2" value="2">
                            <label for="month-2">MAR</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-3" value="3">
                            <label for="month-3">ABR</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-4" value="4">
                            <label for="month-4">MAI</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-5" value="5">
                            <label for="month-5">JUN</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-6" value="6">
                            <label for="month-6">JUL</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-7" value="7">
                            <label for="month-7">AGO</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-8" value="8">
                            <label for="month-8">SET</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-9" value="9">
                            <label for="month-9">OUT</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-10" value="10">
                            <label for="month-10">NOV</label>
                        </div>
                        <div class="month-checkbox">
                            <input type="checkbox" id="month-11" value="11">
                            <label for="month-11">DEZ</label>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-danger" id="deleteTaskBtn"
                        style="display: none; margin-right: auto;">Excluir</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Adding/Editing Categories -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h2 id="categoryModalTitle">Adicionar Nova Categoria</h2>
            <form id="categoryForm">
                <div class="form-group">
                    <label for="categoryName">Nome da Categoria:</label>
                    <input type="text" id="categoryName" required>
                </div>

                <div class="form-group">
                    <label for="categoryColor">Cor:</label>
                    <input type="color" id="categoryColor" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="categoryCancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
